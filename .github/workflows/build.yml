name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach hpg.ipa to releases on version tags

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, device)
        run: |
          xcodebuild -project hpg.xcodeproj -scheme hpg -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/hpg.app Payload/
          zip -qry hpg.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: hpg-unsigned-ipa
          path: hpg.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hpg.ipa
          body: |
            Unsigned build of hpg. Sign and install it with a sideloading tool such as AltStore or
            Sideloadly, or build it yourself with Xcode (see the README).
