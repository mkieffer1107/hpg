<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- hpg app icon: a gator peeking over a server rack whose blades are a job queue.
       Full-bleed square; iOS applies the rounded mask. Render: rsvg-convert -w 1024 icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1546C8"/>
      <stop offset="1" stop-color="#001A6E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3B7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD068"/>
      <stop offset="1" stop-color="#23963A"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#C9D4E6"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2638"/>
      <stop offset="1" stop-color="#0E1522"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(0,-78)">
  <!-- gator head, behind the rack: back of head on the left, long snout to the right -->
  <g>
    <!-- head + snout silhouette -->
    <path d="M196 560
             C196 470 250 420 330 412
             L700 404
             C790 400 846 430 846 488
             C846 530 818 560 770 560 Z" fill="url(#gator)"/>
    <!-- nostrils bump -->
    <ellipse cx="790" cy="420" rx="40" ry="26" fill="#4CC25A"/>
    <ellipse cx="776" cy="414" rx="7" ry="5" fill="#13561F"/>
    <ellipse cx="806" cy="414" rx="7" ry="5" fill="#13561F"/>
    <!-- scutes along the top of the head -->
    <g fill="#2FA845">
      <ellipse cx="560" cy="414" rx="26" ry="11"/>
      <ellipse cx="625" cy="410" rx="22" ry="9"/>
    </g>
    <!-- eye bumps -->
    <circle cx="330" cy="392" r="78" fill="url(#gator)"/>
    <circle cx="470" cy="392" r="78" fill="url(#gator)"/>
    <!-- eyes -->
    <circle cx="336" cy="386" r="50" fill="#FFFFFF"/>
    <circle cx="476" cy="386" r="50" fill="#FFFFFF"/>
    <circle cx="356" cy="392" r="26" fill="#0B1220"/>
    <circle cx="496" cy="392" r="26" fill="#0B1220"/>
    <circle cx="366" cy="382" r="9" fill="#FFFFFF"/>
    <circle cx="506" cy="382" r="9" fill="#FFFFFF"/>
    <!-- sleepy-cool eyelids -->
    <path d="M282 360 A56 56 0 0 1 390 360 Z" fill="#3DB552"/>
    <path d="M422 360 A56 56 0 0 1 530 360 Z" fill="#3DB552"/>
  </g>

  <!-- server rack -->
  <rect x="176" y="540" width="672" height="340" rx="44" fill="url(#rack)"/>
  <rect x="216" y="550" width="592" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
  <!-- teeth along the jaw, resting on the rack -->
  <g fill="#FFFFFF" stroke="#1E7A33" stroke-width="4" stroke-linejoin="round">
    <path d="M586 542 l20 -40 l20 40 Z"/>
    <path d="M650 542 l20 -40 l20 40 Z"/>
    <path d="M714 542 l20 -40 l20 40 Z"/>
  </g>

  <!-- three blades = the queue: lights + progress bars -->
  <g>
    <rect x="216" y="584" width="592" height="78" rx="20" fill="url(#blade)"/>
    <circle cx="258" cy="623" r="15" fill="#3BE36B"/>
    <circle cx="302" cy="623" r="15" fill="#3BE36B" opacity="0.35"/>
    <rect x="342" y="613" width="430" height="20" rx="10" fill="#26344D"/>
    <rect x="342" y="613" width="330" height="20" rx="10" fill="#3BE36B"/>

    <rect x="216" y="682" width="592" height="78" rx="20" fill="url(#blade)"/>
    <circle cx="258" cy="721" r="15" fill="#3BE36B"/>
    <circle cx="302" cy="721" r="15" fill="#3BE36B" opacity="0.35"/>
    <rect x="342" y="711" width="430" height="20" rx="10" fill="#26344D"/>
    <rect x="342" y="711" width="190" height="20" rx="10" fill="#3BE36B"/>

    <rect x="216" y="780" width="592" height="78" rx="20" fill="url(#blade)"/>
    <circle cx="258" cy="819" r="15" fill="#FA4616"/>
    <circle cx="302" cy="819" r="15" fill="#FA4616" opacity="0.35"/>
    <rect x="342" y="809" width="430" height="20" rx="10" fill="#26344D"/>
    <g fill="#FA4616">
      <circle cx="362" cy="819" r="8"/>
      <circle cx="396" cy="819" r="8" opacity="0.7"/>
      <circle cx="430" cy="819" r="8" opacity="0.4"/>
    </g>
  </g>
  </g>
</svg>
